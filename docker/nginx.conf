# ==============================================================================
# AgentFlow — Production Nginx configuration
# Reverse proxy:
#   /       → Streamlit (frontend:8501)
#   /api    → FastAPI   (backend:8000)
# ==============================================================================

# Upstream definitions — names must match docker-compose service names
upstream streamlit_upstream {
    server frontend:8501;
    keepalive 32;
}

upstream fastapi_upstream {
    server backend:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP server — redirects everything to HTTPS when SSL is active.
# In plain HTTP mode (no certs) this block itself serves traffic.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "strict-origin"        always;
    add_header Permissions-Policy        "geolocation=()"       always;

    # ── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ── Global Timeouts ───────────────────────────────────────────────────
    proxy_connect_timeout       60s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;

    # ── Client upload limit (must match Streamlit maxUploadSize) ──────────
    client_max_body_size 200M;

    # ── FastAPI — all /api/* requests ─────────────────────────────────────
    location /api {
        proxy_pass         http://fastapi_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for streaming / SSE responses
        proxy_buffering    off;
        proxy_cache_bypass $http_upgrade;
    }

    # ── FastAPI — Swagger UI / OpenAPI ────────────────────────────────────
    location /docs {
        proxy_pass         http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass         http://fastapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Streamlit — WebSocket endpoint (/_stcore/stream) ──────────────────
    location /_stcore/stream {
        proxy_pass         http://streamlit_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeout for persistent WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Streamlit — health endpoint ───────────────────────────────────────
    location /_stcore/health {
        proxy_pass         http://streamlit_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── Streamlit — everything else ───────────────────────────────────────
    location / {
        proxy_pass         http://streamlit_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade (required for Streamlit's component communication)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/agentflow_access.log;
    error_log  /var/log/nginx/agentflow_error.log warn;
}

