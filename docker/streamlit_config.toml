# Production Streamlit configuration
# Mounted at /home/agentflow/.streamlit/config.toml inside the container

[server]
# Bind to all interfaces inside the container
address = "0.0.0.0"
port = 8501
# Required for container / reverse-proxy operation
headless = true
# Allow connections from any origin (nginx handles CORS / auth)
enableCORS = false
enableXsrfProtection = false
# 200 MB max upload (matches nginx client_max_body_size)
maxUploadSize = 200

[browser]
gatherUsageStats = false
# Streamlit must not try to open a browser inside the container
serverAddress = "0.0.0.0"

[theme]
base = "dark"

[logger]
level = "info"
