# ==============================================================================
# AgentFlow — Production Docker Compose
# Stack:
#   - FastAPI Backend
#   - Streamlit Frontend
#   - Nginx Reverse Proxy
#
# Persistence:
#   - SQLite (chat history / application database)
#   - ChromaDB (vector database)
#
# No Redis
# No PostgreSQL
# ==============================================================================

name: agentflow

# ------------------------------------------------------------------------------
# Network
# ------------------------------------------------------------------------------
networks:
  agentflow_net:
    driver: bridge

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  sqlite_data:
  chroma_data:
  uploads_data:
  nginx_logs:

# ------------------------------------------------------------------------------
# Services
# ------------------------------------------------------------------------------
services:

  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend

    image: agentflow/backend:${IMAGE_TAG:-latest}
    container_name: agentflow_backend

    restart: unless-stopped

    networks:
      - agentflow_net

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    environment:
      ENVIRONMENT: production
      DEBUG: "false"

      # SQLite
      DATABASE_URL: sqlite:///./data/chatbot_memory.db

      # ChromaDB Persistent Directory
      CHROMA_DB_PATH: /app/chroma_db

    volumes:
      # SQLite Database
      - sqlite_data:/app/data

      # ChromaDB
      - chroma_data:/app/chroma_db

      # Uploaded files
      - uploads_data:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================================
  # Streamlit Frontend
  # ============================================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend

    image: agentflow/frontend:${IMAGE_TAG:-latest}
    container_name: agentflow_frontend

    restart: unless-stopped

    networks:
      - agentflow_net

    ports:
      - "8501:8501"

    env_file:
      - ../.env

    environment:
      ENVIRONMENT: production
      BACKEND_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # Nginx Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: agentflow_nginx

    restart: unless-stopped

    networks:
      - agentflow_net

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3