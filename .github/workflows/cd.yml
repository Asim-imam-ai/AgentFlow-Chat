name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.6.14"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      DATABASE_URL: sqlite:///./data/chatbot_memory.db
      CHROMA_DB_PATH: ./data/chroma_db

      BACKEND_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
      FRONTEND_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}

    steps:
      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################################
      # Setup Python
      ####################################################################

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: uv sync --frozen

      ####################################################################
      # Run Tests
      ####################################################################

      - name: Run Tests
        run: |
          mkdir -p data/chroma_db
          uv run pytest tests -v --tb=short

      ####################################################################
      # Configure AWS
      ####################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ####################################################################
      # Verify AWS
      ####################################################################

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      ####################################################################
      # Login Amazon ECR
      ####################################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################################
      # Validate Secrets
      ####################################################################

      - name: Validate Repository Secrets
        shell: bash
        run: |
          set -euo pipefail

          for repo in "$BACKEND_REPOSITORY" "$FRONTEND_REPOSITORY"; do
            if [ -z "$repo" ]; then
              echo "Repository secret is empty."
              exit 1
            fi

            if [[ "$repo" == *$'\n'* ]]; then
              echo "Repository contains newline characters."
              exit 1
            fi
          done

          echo "Backend : $BACKEND_REPOSITORY"
          echo "Frontend: $FRONTEND_REPOSITORY"

      ####################################################################
      # Verify ECR Repositories
      ####################################################################

      - name: Verify ECR Repositories
        run: |
          aws ecr describe-repositories \
            --repository-names "$(basename "$BACKEND_REPOSITORY")"

          aws ecr describe-repositories \
            --repository-names "$(basename "$FRONTEND_REPOSITORY")"

      ####################################################################
      # Setup Docker Buildx
      ####################################################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      ####################################################################
      # Build Backend
      ####################################################################

      - name: Build Backend Image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -f docker/Dockerfile.backend \
            -t "${BACKEND_REPOSITORY}:latest" .

      ####################################################################
      # Build Frontend
      ####################################################################

      - name: Build Frontend Image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -f docker/Dockerfile.frontend \
            -t "${FRONTEND_REPOSITORY}:latest" .

      ####################################################################
      # Verify Images
      ####################################################################

      - name: Verify Docker Images
        run: docker images

      ####################################################################
      # Push Backend
      ####################################################################

      - name: Push Backend Image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${BACKEND_REPOSITORY}:latest"

      ####################################################################
      # Push Frontend
      ####################################################################

      - name: Push Frontend Image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${FRONTEND_REPOSITORY}:latest"

      ####################################################################
      # Configure SSH
      ####################################################################

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      ####################################################################
      # Deploy to EC2
      ####################################################################

      - name: Deploy to EC2
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no \
          "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'

          set -euo pipefail

          cd ~/AgentFlow-Chat

          docker compose pull

          docker compose up -d --remove-orphans

          docker image prune -af

          docker ps

          EOF
