name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.6.14"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      DATABASE_URL: sqlite:///./data/chatbot_memory.db
      CHROMA_DB_PATH: ./data/chroma_db

      BACKEND_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
      FRONTEND_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}

    steps:
      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################################
      # Python
      ####################################################################

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: uv sync --frozen

      ####################################################################
      # Tests
      ####################################################################

      - name: Run Tests
        run: |
          mkdir -p data
          mkdir -p data/chroma_db
          uv run pytest tests -v --tb=short

      ####################################################################
      # Configure AWS
      ####################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ####################################################################
      # Login ECR
      ####################################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################################
      # Verify Secrets
      ####################################################################

      - name: Verify ECR Repository Secrets
        run: |
          set -e

          if [ -z "${BACKEND_REPOSITORY}" ]; then
            echo "Missing ECR_BACKEND_REPOSITORY secret"
            exit 1
          fi

          if [ -z "${FRONTEND_REPOSITORY}" ]; then
            echo "Missing ECR_FRONTEND_REPOSITORY secret"
            exit 1
          fi

          echo "Secrets verified."

      ####################################################################
      # Build Backend
      ####################################################################

      - name: Build Backend Image
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t ${BACKEND_REPOSITORY}:latest .

      ####################################################################
      # Build Frontend
      ####################################################################

      - name: Build Frontend Image
        run: |
          docker build \
            -f docker/Dockerfile.frontend \
            -t ${FRONTEND_REPOSITORY}:latest .

      ####################################################################
      # Push Backend
      ####################################################################

      - name: Push Backend Image
        run: |
          docker push ${BACKEND_REPOSITORY}:latest

      ####################################################################
      # Push Frontend
      ####################################################################

      - name: Push Frontend Image
        run: |
          docker push ${FRONTEND_REPOSITORY}:latest

      ####################################################################
      # SSH Key
      ####################################################################

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      ####################################################################
      # Deploy
      ####################################################################

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

          cd ~/AgentFlow-Chat

          docker compose pull

          docker compose up -d

          docker image prune -af

          EOF
