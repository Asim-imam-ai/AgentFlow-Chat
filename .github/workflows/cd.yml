name: Continuous Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

  BACKEND_IMAGE: ${{ secrets.ECR_BACKEND_REPOSITORY }}
  FRONTEND_IMAGE: ${{ secrets.ECR_FRONTEND_REPOSITORY }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      ##########################################################################
      # Checkout Repository
      ##########################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##########################################################################
      # Configure AWS Credentials
      ##########################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ##########################################################################
      # Login to Amazon ECR
      ##########################################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ##########################################################################
      # Verify Configuration
      ##########################################################################

      - name: Verify Environment
        run: |
          echo "Registry  : ${{ steps.login-ecr.outputs.registry }}"
          echo "Backend   : ${BACKEND_IMAGE}"
          echo "Frontend  : ${FRONTEND_IMAGE}"

          test -n "${BACKEND_IMAGE}"
          test -n "${FRONTEND_IMAGE}"

      ##########################################################################
      # Build Backend Image
      ##########################################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t ${{ steps.login-ecr.outputs.registry }}/${BACKEND_IMAGE}:latest \
            .

      ##########################################################################
      # Build Frontend Image
      ##########################################################################

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -f docker/Dockerfile.frontend \
            -t ${{ steps.login-ecr.outputs.registry }}/${FRONTEND_IMAGE}:latest \
            .

      ##########################################################################
      # Push Backend Image
      ##########################################################################

      - name: Push Backend Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${BACKEND_IMAGE}:latest

      ##########################################################################
      # Push Frontend Image
      ##########################################################################

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${FRONTEND_IMAGE}:latest

      ##########################################################################
      # Deploy to EC2
      ##########################################################################

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password \
              --region ${{ secrets.AWS_REGION }} | \
            docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            cd ~/agentflow

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -af
