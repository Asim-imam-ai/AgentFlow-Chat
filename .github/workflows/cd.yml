name: Continuous Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

  BACKEND_IMAGE: ${{ secrets.ECR_BACKEND_REPOSITORY }}
  FRONTEND_IMAGE: ${{ secrets.ECR_FRONTEND_REPOSITORY }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      ##########################################################################
      # Checkout Repository
      ##########################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##########################################################################
      # Configure AWS Credentials
      ##########################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      ##########################################################################
      # Login to Amazon ECR
      ##########################################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ##########################################################################
      # Verify Configuration
      ##########################################################################

      - name: Verify Environment
        run: |
          echo "Registry  : ${{ steps.login-ecr.outputs.registry }}"
          echo "Backend   : ${BACKEND_IMAGE}"
          echo "Frontend  : ${FRONTEND_IMAGE}"

          test -n "${BACKEND_IMAGE}"
          test -n "${FRONTEND_IMAGE}"

      ##########################################################################
      # Build Backend Image
      ##########################################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t ${{ steps.login-ecr.outputs.registry }}/${BACKEND_IMAGE}:latest \
            .

      ##########################################################################
      # Build Frontend Image
      ##########################################################################

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -f docker/Dockerfile.frontend \
            -t ${{ steps.login-ecr.outputs.registry }}/${FRONTEND_IMAGE}:latest \
            .

      ##########################################################################
      # Push Backend Image
      ##########################################################################

      - name: Push Backend Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${BACKEND_IMAGE}:latest

      ##########################################################################
      # Push Frontend Image
      ##########################################################################

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${FRONTEND_IMAGE}:latest

      ##########################################################################
      # SSH Connectivity Pre-check (diagnostics)
      ##########################################################################

      - name: Verify SSH connectivity to EC2
        if: always()
        run: |
          echo "Writing SSH key to /tmp/deploy_key"
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          echo "Testing TCP connectivity to ${EC2_HOST}:22 (timeout 10s)"
          # quick SSH connectivity test; will fail fast with clear message
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/deploy_key "${EC2_USERNAME}@${EC2_HOST}" 'echo SSH_OK' || (
            echo "";
            echo "ERROR: SSH connection failed. Check the following:";
            echo " - secrets.EC2_HOST is correct and has a public IP/DNS";
            echo " - secrets.EC2_SSH_KEY contains the private key PEM with exact newlines";
            echo " - secrets.EC2_USERNAME is correct (ec2-user / ubuntu / centos / admin)";
            echo " - The instance security group allows inbound TCP/22 from GitHub Actions runners";
            echo " - The instance is running and reachable from the internet (or use SSM if it's in a private subnet)";
            exit 1
          )
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

      ##########################################################################
      # Deploy to EC2 (via SSH)
      ##########################################################################

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30
          script: |
            set -e
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            cd ~/agentflow

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -af

      ##########################################################################
      # Alternative: Deploy via AWS SSM (uncomment and use if preferred)
      # This avoids exposing SSH to the public internet. Requires the instance
      # to have the SSM agent and an instance profile with AmazonSSMManagedInstanceCore.
      ##########################################################################

      # - name: Deploy via SSM
      #   if: false
