      #     INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=agentflow" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
      #     if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
      #       echo "Instance not found"; exit 1
      #     fi
      #     aws ssm send-command \
      #       --instance-ids "$INSTANCE_ID" \
      #       --document-name "AWS-RunShellScript" \
      #       --comment "Deploy from GitHub Actions" \
      #       --parameters commands='[
      #         "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${STEP_REGISTRY}",
      #         "cd ~/agentflow || exit 1",
      #         "docker compose pull",
      #         "docker compose up -d --remove-orphans",
      #         "docker image prune -af"
      #       ]' \
      #       --timeout-seconds 600 \
      #       --query "Command.CommandId" --output text > /tmp/ssm_cmd_id
