name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.6.14"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      DATABASE_URL: sqlite:///./data/chatbot_memory.db
      CHROMA_DB_PATH: ./data/chroma_db

      BACKEND_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
      FRONTEND_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}

    steps:
      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################################
      # Setup Python
      ####################################################################

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: uv sync --frozen

      ####################################################################
      # Run Tests
      ####################################################################

      - name: Run Tests
        run: |
          mkdir -p data
          mkdir -p data/chroma_db
          uv run pytest tests -v --tb=short

      ####################################################################
      # Configure AWS Credentials
      ####################################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ####################################################################
      # Verify AWS Identity
      ####################################################################

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      ####################################################################
      # Login to Amazon ECR
      ####################################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################################
      # Verify Repository Secrets
      ####################################################################

      - name: Verify Repository Secrets
        run: |
          set -e

          [ -n "$BACKEND_REPOSITORY" ] || { echo "ECR_BACKEND_REPOSITORY is missing"; exit 1; }
          [ -n "$FRONTEND_REPOSITORY" ] || { echo "ECR_FRONTEND_REPOSITORY is missing"; exit 1; }

          echo "Backend Repository: $BACKEND_REPOSITORY"
          echo "Frontend Repository: $FRONTEND_REPOSITORY"

      ####################################################################
      # Verify ECR Repositories
      ####################################################################

      - name: Verify ECR Repositories
        run: |
          aws ecr describe-repositories \
            --repository-names "$(basename "$BACKEND_REPOSITORY")"

          aws ecr describe-repositories \
            --repository-names "$(basename "$FRONTEND_REPOSITORY")"

      ####################################################################
      # Build Backend
      ####################################################################

      - name: Build Backend Image
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t "$BACKEND_REPOSITORY:latest" .

      ####################################################################
      # Build Frontend
      ####################################################################

      - name: Build Frontend Image
        run: |
          docker build \
            -f docker/Dockerfile.frontend \
            -t "$FRONTEND_REPOSITORY:latest" .

      ####################################################################
      # Show Docker Images
      ####################################################################

      - name: Show Docker Images
        run: docker images

      ####################################################################
      # Push Backend
      ####################################################################

      - name: Push Backend Image
        run: |
          docker push "$BACKEND_REPOSITORY:latest"

      ####################################################################
      # Push Frontend
      ####################################################################

      - name: Push Frontend Image
        run: |
          docker push "$FRONTEND_REPOSITORY:latest"

      ####################################################################
      # Configure SSH
      ####################################################################

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      ####################################################################
      # Deploy to EC2
      ####################################################################

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'

          set -e

          cd ~/AgentFlow-Chat

          docker compose pull

          docker compose up -d

          docker image prune -af

          EOF
